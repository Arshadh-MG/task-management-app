<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Event Calendar</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Theme Toggle Floating Button -->
    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme">
        <!-- Sun Icon -->
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <!-- Moon Icon -->
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>

    <!-- Main Card Panel Container -->
    <div class="form-panel" style="width: min(100%, 650px); min-height: auto; position: relative;">
        <!-- Back to Calendar Top-Left Button -->
        <button type="button" id="backToCalendarBtn" style="position: absolute; top: 1.5rem; left: 1.5rem; width: 38px; height: 38px; display: grid; place-items: center; border-radius: var(--control-radius); background: var(--surface-input); border: 1px solid var(--border); color: var(--text); cursor: pointer;" title="Back to Calendar">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>
        <!-- Alert notifications wrapper -->
        <div id="alertBox" class="alert-container hidden">
            <div class="alert-content">
                <span class="alert-icon"></span>
                <span class="alert-message"></span>
            </div>
        </div>

        <!-- PROFILE HEADER -->
        <div class="form-header" style="text-align: center; margin-bottom: 2.5rem; position: relative;">
            <h2>User Profile</h2>
            <p class="subtitle">View and update your registration details</p>
            
            <!-- Large Initial Circle -->
            <div style="width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #ffffff; font-family: var(--font-title); font-size: 1.8rem; font-weight: 700; display: grid; place-items: center; margin: 1.5rem auto 0; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.24);" id="profileAvatarCircle">U</div>
        </div>

        <!-- Edit Form -->
        <form id="profileForm" novalidate>
            <!-- Full Name and Email -->
            <div class="form-row">
                <div class="form-group">
                    <label for="profileName">Full Name</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" id="profileName" placeholder="Full name" required>
                    </div>
                    <span class="validation-message" id="profileNameError"></span>
                </div>

                <div class="form-group">
                    <label for="profileEmail">Email Address (Read-only)</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="email" id="profileEmail" placeholder="email@domain.com" disabled style="opacity: 0.6; cursor: not-allowed; background: var(--surface-input);">
                    </div>
                    <span class="validation-message"></span>
                </div>
            </div>

            <!-- Role and Creation Date Display -->
            <div class="form-row">
                <div class="form-group">
                    <label for="profileRole">Account Role</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </span>
                        <input type="text" id="profileRole" placeholder="Account role" required>
                    </div>
                    <span class="validation-message" id="profileRoleError"></span>
                </div>

                <div class="form-group">
                    <label>Member Since</label>
                    <div style="min-height: 46px; border: 1px solid var(--border); border-radius: var(--control-radius); background: var(--surface-input); display: flex; align-items: center; padding: 0 1rem; color: var(--muted); font-size: 0.9rem;" id="memberSinceText">-</div>
                </div>
            </div>

            <!-- Password Fields Section Header -->
            <div style="margin: 1.5rem 0 1rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                <h3 style="font-family: var(--font-title); font-size: 1.05rem; color: var(--text);">Change Password</h3>
                <p class="subtitle" style="font-size: 0.8rem; margin-top: 0.15rem;">Leave password fields empty if you don't wish to change it</p>
            </div>

            <!-- Optional Password Fields -->
            <div class="form-row">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="newPassword" placeholder="New Password">
                        <button type="button" class="password-toggle" tabindex="-1" aria-label="Toggle password visibility">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <span class="validation-message" id="newPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="confirmNewPassword" placeholder="Confirm Password">
                        <button type="button" class="password-toggle" tabindex="-1" aria-label="Toggle password visibility">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <span class="validation-message" id="confirmNewPasswordError"></span>
                </div>
            </div>

            <!-- Submit actions -->
            <div class="form-row" style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" id="saveProfileBtn">
                    <span class="btn-text">Save Changes</span>
                    <div class="loader hidden"></div>
                </button>
            </div>
        </form>
    </div>

    <!-- Core profile dashboard logic -->
    <script src="profile.js"></script>
</body>
</html>
