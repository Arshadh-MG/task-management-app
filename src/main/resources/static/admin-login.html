<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Sign In</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Theme Toggle Floating Button -->
    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme">
        <!-- Sun Icon -->
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <!-- Moon Icon -->
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>

    <!-- Form Cards Container -->
    <div class="form-panel">
        <!-- Alert notifications wrapper -->
        <div id="alertBox" class="alert-container hidden">
            <div class="alert-content">
                <span class="alert-icon"></span>
                <span class="alert-message"></span>
            </div>
        </div>

        <!-- ADMIN LOGIN CARD -->
        <div class="form-card active" id="adminLoginCard">
            <div class="form-header">
                <div style="display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(96, 165, 250, 0.12); padding: 0.35rem 0.75rem; border-radius: 20px; color: var(--accent); font-size: 0.8rem; font-weight: 700; margin-bottom: 0.75rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span>ADMIN PORTAL</span>
                </div>
                <h2>Admin Sign In</h2>
                <p class="subtitle">Access the Administrator Dashboard & Management Panel</p>
            </div>

            <form id="adminLoginForm" novalidate>
                <div class="form-group">
                    <label for="adminEmail">Admin Email</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                        <input type="email" id="adminEmail" placeholder="admin@scf.com" required>
                    </div>
                    <span class="validation-message" id="adminEmailError"></span>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="adminPassword">Password</label>
                        <a href="./forgot-password.html" class="forgot-link">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="adminPassword" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" tabindex="-1" aria-label="Toggle password visibility">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <span class="validation-message" id="adminPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="adminLoginSubmitBtn">
                    <span class="btn-text">Sign In as Admin</span>
                    <div class="loader hidden"></div>
                </button>
            </form>

            <div class="form-footer" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <div>
                    <span>Need an Admin account? </span>
                    <a href="#" class="toggle-link" id="showAdminRegister">Register Admin</a>
                </div>
                <div>
                    <a href="./index.html" class="toggle-link" style="font-size: 0.85rem; color: var(--muted);">← Back to User Login</a>
                </div>
            </div>
        </div>

        <!-- ADMIN REGISTER CARD -->
        <div class="form-card hidden" id="adminRegisterCard">
            <div class="form-header">
                <div style="display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(96, 165, 250, 0.12); padding: 0.35rem 0.75rem; border-radius: 20px; color: var(--accent); font-size: 0.8rem; font-weight: 700; margin-bottom: 0.75rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span>NEW ADMINISTRATOR</span>
                </div>
                <h2>Register Admin</h2>
                <p class="subtitle">Create an administrator profile to manage the workspace</p>
            </div>

            <form id="adminRegisterForm" novalidate>
                <div class="form-group">
                    <label for="adminRegName">Full Name</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" id="adminRegName" placeholder="Admin Name" required>
                    </div>
                    <span class="validation-message" id="adminRegNameError"></span>
                </div>

                <div class="form-group">
                    <label for="adminRegEmail">Email Address</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                        <input type="email" id="adminRegEmail" placeholder="admin@scf.com" required>
                    </div>
                    <span class="validation-message" id="adminRegEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="adminRegRole">Role</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                        </span>
                        <input type="text" id="adminRegRole" value="Administrator" readonly style="cursor: not-allowed; opacity: 0.85;">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="adminRegPassword">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="adminRegPassword" placeholder="••••••••" required style="padding-left: 1rem;">
                        </div>
                        <span class="validation-message" id="adminRegPasswordError"></span>
                    </div>
                    <div class="form-group">
                        <label for="adminRegConfirmPassword">Confirm</label>
                        <div class="input-wrapper">
                            <input type="password" id="adminRegConfirmPassword" placeholder="••••••••" required style="padding-left: 1rem;">
                        </div>
                        <span class="validation-message" id="adminRegConfirmPasswordError"></span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="adminRegisterSubmitBtn">
                    <span class="btn-text">Create Admin Account</span>
                    <div class="loader hidden"></div>
                </button>
            </form>

            <div class="form-footer">
                <span>Already have an Admin account? </span>
                <a href="#" class="toggle-link" id="showAdminLogin">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Script for Admin Auth -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const sunIcon = themeToggleBtn?.querySelector('.sun-icon');
            const moonIcon = themeToggleBtn?.querySelector('.moon-icon');

            let theme = localStorage.getItem('lms_portal_theme') || 'dark';
            applyTheme(theme);

            themeToggleBtn?.addEventListener('click', () => {
                theme = theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('lms_portal_theme', theme);
                applyTheme(theme);
            });

            function applyTheme(t) {
                if (t === 'light') {
                    document.body.classList.add('light-theme');
                    if (sunIcon) sunIcon.style.display = 'none';
                    if (moonIcon) moonIcon.style.display = 'block';
                } else {
                    document.body.classList.remove('light-theme');
                    if (sunIcon) sunIcon.style.display = 'block';
                    if (moonIcon) moonIcon.style.display = 'none';
                }
            }

            // Cards Toggle
            const adminLoginCard = document.getElementById('adminLoginCard');
            const adminRegisterCard = document.getElementById('adminRegisterCard');
            const showAdminRegister = document.getElementById('showAdminRegister');
            const showAdminLogin = document.getElementById('showAdminLogin');

            showAdminRegister.addEventListener('click', (e) => {
                e.preventDefault();
                adminLoginCard.classList.add('hidden');
                adminRegisterCard.classList.remove('hidden');
            });

            showAdminLogin.addEventListener('click', (e) => {
                e.preventDefault();
                adminRegisterCard.classList.add('hidden');
                adminLoginCard.classList.remove('hidden');
            });

            // Password toggle
            document.querySelectorAll('.password-toggle').forEach(btn => {
                btn.addEventListener('click', () => {
                    const input = btn.parentElement.querySelector('input');
                    const eyeOpen = btn.querySelector('.eye-open');
                    const eyeClosed = btn.querySelector('.eye-closed');
                    if (input.type === 'password') {
                        input.type = 'text';
                        eyeOpen.classList.add('hidden');
                        eyeClosed.classList.remove('hidden');
                    } else {
                        input.type = 'password';
                        eyeOpen.classList.remove('hidden');
                        eyeClosed.classList.add('hidden');
                    }
                });
            });

            const alertBox = document.getElementById('alertBox');
            const alertMessage = alertBox.querySelector('.alert-message');

            function showAlert(msg, type = 'danger') {
                alertBox.className = `alert-container ${type}`;
                alertMessage.textContent = msg;
                alertBox.classList.remove('hidden');
                setTimeout(() => alertBox.classList.add('hidden'), 4000);
            }

            // Admin Login Submit
            const adminLoginForm = document.getElementById('adminLoginForm');
            adminLoginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('adminEmail').value.trim();
                const password = document.getElementById('adminPassword').value;

                if (!email || !password) {
                    showAlert('Please provide both email and password.');
                    return;
                }

                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Login failed.');

                    // Store session
                    localStorage.setItem('admin_token', 'adm_' + Date.now());
                    localStorage.setItem('admin_user', JSON.stringify({
                        userId: data.user.id,
                        fullName: data.user.fullName,
                        email: data.user.email,
                        role: data.user.role || 'Administrator'
                    }));

                    window.location.href = './admin.html';
                } catch (err) {
                    showAlert(err.message);
                }
            });

            // Admin Register Submit
            const adminRegisterForm = document.getElementById('adminRegisterForm');
            adminRegisterForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fullName = document.getElementById('adminRegName').value.trim();
                const email = document.getElementById('adminRegEmail').value.trim();
                const role = 'Administrator';
                const password = document.getElementById('adminRegPassword').value;
                const confirm = document.getElementById('adminRegConfirmPassword').value;

                if (!fullName || !email || !password) {
                    showAlert('Please fill in all required fields.');
                    return;
                }

                if (password !== confirm) {
                    showAlert('Passwords do not match.');
                    return;
                }

                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fullName, email, role, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Registration failed.');

                    showAlert('Admin registered successfully! You can now sign in.', 'success');
                    adminRegisterForm.reset();
                    setTimeout(() => {
                        adminRegisterCard.classList.add('hidden');
                        adminLoginCard.classList.remove('hidden');
                    }, 1200);
                } catch (err) {
                    showAlert(err.message);
                }
            });
        });
    </script>
</body>
</html>
