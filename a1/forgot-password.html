<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="calendar-page" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">
    <!-- Theme Toggle Floating Button -->
    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme">
        <!-- Sun Icon -->
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <!-- Moon Icon -->
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>

    <div class="form-panel">
        <div class="form-card active" id="resetCard">
            <div class="form-header">
                <h2>Reset Password</h2>
                <p class="subtitle">Enter your email and new password</p>
            </div>

            <!-- Alert notification box -->
            <div id="alertBox" class="alert-container hidden" role="status" aria-live="polite">
                <div class="alert-content">
                    <span class="alert-icon"></span>
                    <span class="alert-message"></span>
                </div>
            </div>

            <form id="resetForm" novalidate>
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                        <input type="email" id="resetEmail" placeholder="name@scf.com" required>
                    </div>
                    <span class="validation-message" id="resetEmailError"></span>
                </div>

                <div class="form-group">
                    <label for="resetPassword">New Password</label>
                    <div class="input-wrapper">
                        <span class="field-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="resetPassword" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" tabindex="-1" aria-label="Toggle password visibility">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <span class="validation-message" id="resetPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="resetSubmitBtn">
                    <span class="btn-text">Reset Password</span>
                    <div class="loader hidden"></div>
                </button>
            </form>

            <div class="form-footer">
                <span>Remembered your password? </span>
                <a href="./index.html" class="toggle-link">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const sunIcon = themeToggleBtn?.querySelector('.sun-icon');
            const moonIcon = themeToggleBtn?.querySelector('.moon-icon');

            const resetForm = document.getElementById('resetForm');
            const resetEmail = document.getElementById('resetEmail');
            const resetPassword = document.getElementById('resetPassword');
            const resetEmailError = document.getElementById('resetEmailError');
            const resetPasswordError = document.getElementById('resetPasswordError');
            
            const alertBox = document.getElementById('alertBox');
            const alertMessage = alertBox?.querySelector('.alert-message');
            
            // --- THEME ---
            let theme = localStorage.getItem('lms_portal_theme') || 'dark';
            applyTheme(theme);

            themeToggleBtn?.addEventListener('click', () => {
                theme = theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('lms_portal_theme', theme);
                applyTheme(theme);
            });

            function applyTheme(theme) {
                if (theme === 'light') {
                    body.classList.add('light-theme');
                    if (sunIcon) sunIcon.style.display = 'none';
                    if (moonIcon) moonIcon.style.display = 'block';
                } else {
                    body.classList.remove('light-theme');
                    if (sunIcon) sunIcon.style.display = 'block';
                    if (moonIcon) moonIcon.style.display = 'none';
                }
            }

            // --- PASSWORD TOGGLE ---
            const toggleBtn = document.querySelector('.password-toggle');
            toggleBtn?.addEventListener('click', (e) => {
                e.preventDefault();
                const eyeOpen = toggleBtn.querySelector('.eye-open');
                const eyeClosed = toggleBtn.querySelector('.eye-closed');
                if (resetPassword.type === 'password') {
                    resetPassword.type = 'text';
                    eyeOpen?.classList.add('hidden');
                    eyeClosed?.classList.remove('hidden');
                } else {
                    resetPassword.type = 'password';
                    eyeOpen?.classList.remove('hidden');
                    eyeClosed?.classList.add('hidden');
                }
            });

            // --- SUBMIT RESET ---
            resetForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Clear validation errors
                resetEmailError.textContent = '';
                resetPasswordError.textContent = '';
                alertBox.classList.add('hidden');

                const email = resetEmail.value.trim();
                const password = resetPassword.value;

                let hasError = false;
                if (!email) {
                    resetEmailError.textContent = 'Email is required.';
                    hasError = true;
                } else if (!/\S+@\S+\.\S+/.test(email)) {
                    resetEmailError.textContent = 'Invalid email format.';
                    hasError = true;
                }

                if (!password) {
                    resetPasswordError.textContent = 'New Password is required.';
                    hasError = true;
                } else if (password.length < 6) {
                    resetPasswordError.textContent = 'Password must be at least 6 characters.';
                    hasError = true;
                }

                if (hasError) return;

                // Send request
                const submitBtn = document.getElementById('resetSubmitBtn');
                const btnText = submitBtn.querySelector('.btn-text');
                const loader = submitBtn.querySelector('.loader');

                btnText.classList.add('hidden');
                loader.classList.remove('hidden');
                submitBtn.disabled = true;

                fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                .then(async response => {
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Failed to reset password.');
                    return result;
                })
                .then(result => {
                    showAlert('success', 'Password reset successfully! Redirecting...');
                    setTimeout(() => {
                        window.location.href = './index.html';
                    }, 2000);
                })
                .catch(error => {
                    showAlert('danger', error.message);
                    btnText.classList.remove('hidden');
                    loader.classList.add('hidden');
                    submitBtn.disabled = false;
                });
            });

            function showAlert(type, message) {
                alertBox.className = `alert-container ${type}`;
                alertMessage.textContent = message;
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
